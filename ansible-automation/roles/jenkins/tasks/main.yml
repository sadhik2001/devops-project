---
# Jenkins installation and configuration tasks
# Tested on: Amazon Linux 2023 / RHEL 8

- name: Install Java 17 (Jenkins requirement)
  ansible.builtin.dnf:
    name: java-17-amazon-corretto
    state: present
  become: true

- name: Add Jenkins YUM repository
  ansible.builtin.yum_repository:
    name: jenkins
    description: Jenkins Stable Repository
    baseurl: https://pkg.jenkins.io/redhat-stable
    gpgkey: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key
    gpgcheck: true
    enabled: true
  become: true

- name: Install Jenkins {{ jenkins_version }}
  ansible.builtin.dnf:
    name: "jenkins-{{ jenkins_version }}"
    state: present
  become: true
  notify: Restart Jenkins

- name: Ensure Jenkins service is started and enabled
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for Jenkins to come up
  ansible.builtin.uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: 200
    timeout: 10
  register: jenkins_up
  until: jenkins_up.status == 200
  retries: 30
  delay: 10

- name: Retrieve initial admin password
  ansible.builtin.slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  become: true
  register: jenkins_initial_password
  when: jenkins_initial_password_file.stat.exists is not defined

- name: Print Jenkins initial admin password
  ansible.builtin.debug:
    msg: "Jenkins initial admin password: {{ jenkins_initial_password.content | b64decode }}"
  when: jenkins_initial_password is defined and not jenkins_initial_password.skipped | default(false)

- name: Install Jenkins plugins via CLI
  ansible.builtin.shell: |
    java -jar /var/cache/jenkins/war/WEB-INF/lib/cli-*.jar \
      -s http://localhost:{{ jenkins_http_port }}/ \
      -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }} \
      install-plugin {{ item }} --deploy
  loop: "{{ jenkins_plugins }}"
  become: true
  notify: Restart Jenkins

- name: Deploy Jenkins jobs (JCasC-style Groovy)
  ansible.builtin.template:
    src: payg-pipeline.groovy.j2
    dest: /var/lib/jenkins/init.groovy.d/payg-pipeline.groovy
    owner: jenkins
    group: jenkins
    mode: '0640'
  become: true
  notify: Restart Jenkins

- name: Configure Jenkins system (JVM options)
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/jenkins
    regexp: '^JENKINS_JAVA_OPTIONS='
    line: 'JENKINS_JAVA_OPTIONS="-Xmx2g -XX:+UseContainerSupport -Dhudson.model.DirectoryBrowserSupport.CSP="'
  become: true
  notify: Restart Jenkins

- name: Open firewall port for Jenkins
  ansible.builtin.firewalld:
    port: "{{ jenkins_http_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  become: true
  ignore_errors: true
