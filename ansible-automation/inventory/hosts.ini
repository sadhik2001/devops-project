# Ansible inventory for PayG Plus DevOps infrastructure
# Replace IPs with your actual server addresses

[jenkins]
jenkins-server ansible_host=10.0.1.10 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/payg-devops.pem

[sonarqube]
sonar-server  ansible_host=10.0.1.20 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/payg-devops.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
