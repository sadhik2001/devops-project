image:
  repository: "123456789012.dkr.ecr.ap-south-1.amazonaws.com/payg-payment-gateway"
  tag: "latest"

replicaCount: 1

autoscaling:
  enabled: false

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
  hosts:
    - host: api-dev.payg.internal
      paths:
        - path: /api
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  APP_ENV: "dev"
  SERVER_PORT: "8080"
  DB_PORT: "5432"
  DB_NAME: "payg_db_dev"

externalSecret:
  enabled: true
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: payg/dev/db
        property: host
    - secretKey: DB_USERNAME
      remoteRef:
        key: payg/dev/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payg/dev/db
        property: password

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/payg-eks-dev-external-secrets-role"

podDisruptionBudget:
  enabled: false

topologySpreadConstraints: []
