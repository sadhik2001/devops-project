name: PR Validation – PayG Plus

on:
  pull_request:
    branches: [main, develop, release/**]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_NAME: payg-payment-gateway

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Code Quality & Unit Tests
  # ────────────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for SonarQube blame

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run unit tests with JaCoCo
        run: mvn test -B --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: application/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: application/target/site/jacoco/
          retention-days: 7

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=payg-payment-gateway \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --no-transfer-progress

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Dockerfile Lint + Image Build + Trivy Scan
  # ────────────────────────────────────────────────────────────────────────────
  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For uploading SARIF to GitHub Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push – scan only)
        uses: docker/build-push-action@v5
        with:
          context: application
          file: application/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run Trivy vulnerability scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Run Trivy scan (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy CRITICAL gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Terraform Validate + Lint
  # ────────────────────────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform format check
        run: |
          cd infrastructure
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform init (dev)
        run: |
          cd infrastructure/environments/dev
          terraform init -backend=false

      - name: Terraform validate (dev)
        run: |
          cd infrastructure/environments/dev
          terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          cd infrastructure
          tflint --init
          tflint --recursive

      - name: Checkov IaC security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: Helm Chart Lint & Template Validation
  # ────────────────────────────────────────────────────────────────────────────
  helm-validate:
    name: Helm Chart Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm lint – payg-app
        run: helm lint helm-charts/payg-app

      - name: Helm template – dev values
        run: |
          helm template payg-payment-gateway helm-charts/payg-app \
            -f helm-charts/payg-app/values-dev.yaml \
            --debug > /tmp/rendered-dev.yaml
          echo "✅ Dev template rendered successfully"

      - name: Helm template – prod values
        run: |
          helm template payg-payment-gateway helm-charts/payg-app \
            -f helm-charts/payg-app/values-prod.yaml \
            --debug > /tmp/rendered-prod.yaml
          echo "✅ Prod template rendered successfully"

      - name: Validate rendered manifests with kubeval
        run: |
          curl -sSL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          ./kubeval /tmp/rendered-dev.yaml --ignore-missing-schemas || true
          ./kubeval /tmp/rendered-prod.yaml --ignore-missing-schemas || true

  # ────────────────────────────────────────────────────────────────────────────
  # Job 5: PR Summary Comment
  # ────────────────────────────────────────────────────────────────────────────
  pr-summary:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, container-security, terraform-validate, helm-validate]
    if: always()

    steps:
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'Code Quality & Tests': '${{ needs.code-quality.result }}',
              'Container Security':   '${{ needs.container-security.result }}',
              'Terraform Validate':   '${{ needs.terraform-validate.result }}',
              'Helm Validation':      '${{ needs.helm-validate.result }}'
            };
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${icon(result)} | ${name} | ${result} |`)
              .join('\n');
            const body = `## 🔍 PR Validation Summary\n\n| Status | Check | Result |\n|---|---|---|\n${rows}\n\n_Triggered by commit \`${{ github.sha }}\`_`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
