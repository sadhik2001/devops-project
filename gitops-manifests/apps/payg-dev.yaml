apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payg-payment-gateway-dev
  namespace: argocd
  labels:
    app: payg-payment-gateway
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: payg-platform

  source:
    repoURL: https://github.com/YOUR_ORG/gitops-manifests.git
    targetRevision: main
    path: environments/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: payg-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 5
