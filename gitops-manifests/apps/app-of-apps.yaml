# Root Argo CD Application (App-of-Apps pattern)
# This single application manages ALL other Argo CD applications
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payg-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: payg-plus
    managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: payg-platform

  source:
    repoURL: https://github.com/YOUR_ORG/gitops-manifests.git
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
