apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payg-payment-gateway-production
  namespace: argocd
  labels:
    app: payg-payment-gateway
    environment: production
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: devops-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: devops-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: payg-platform

  source:
    repoURL: https://github.com/YOUR_ORG/gitops-manifests.git
    targetRevision: main
    path: environments/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: payg-production

  syncPolicy:
    # Production: manual sync – human approval required
    automated: null
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  revisionHistoryLimit: 10
